/* Layout idea: one simple column. Big button on top, forecast cards, small calendar, history. */
:root{
  --bg:#f6eef0; --surface:#fffafb; --ink:#2a1218; --muted:#70505a; --line:#e8d4d9;
  --period:#8a1b3a; --period-ink:#ffffff; --fert:#f1d5dc; --fert-ink:#5e1226;
  --ov:#d4a24c; --ov-ink:#2b1a00; --accent:#6d1129; --accent-ink:#ffffff;
  --display:'Unbounded','Manrope',system-ui,sans-serif; --body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a0a0f; --surface:#271218; --ink:#f4e6e9; --muted:#c7a4ad; --line:#40242c;
    --period:#d6516f; --period-ink:#2a0710; --fert:#4a1f2c; --fert-ink:#f3b9c8;
    --ov:#e8b85a; --ov-ink:#2b1d00; --accent:#e07a93; --accent-ink:#2a0710; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1a0a0f; --surface:#271218; --ink:#f4e6e9; --muted:#c7a4ad; --line:#40242c;
  --period:#d6516f; --period-ink:#2a0710; --fert:#4a1f2c; --fert-ink:#f3b9c8;
  --ov:#e8b85a; --ov-ink:#2b1d00; --accent:#e07a93; --accent-ink:#2a0710; color-scheme:dark;
}

html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
#root{max-width:520px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:14px}
h1,h2{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.2}
.for{color:var(--accent);font-weight:700;margin-top:6px}
h2{font-family:var(--display);font-weight:500;font-size:15px;margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.k{font-size:13px;color:var(--muted)}
.big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.sub{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.now .phase{font-family:var(--display);font-weight:500;font-size:17px;margin-top:2px}
button,input{font:inherit;color:inherit}
.main{width:100%;background:var(--accent);color:var(--accent-ink);border:0;border-radius:16px;padding:18px 16px;font-weight:700;font-size:18px;min-height:60px;cursor:pointer}
.link{background:none;border:0;color:var(--accent);font-weight:700;text-decoration:underline;padding:8px 0;cursor:pointer;min-height:40px}
.date-row{display:flex;gap:10px}
.date-row input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:46px}
.date-row button{background:transparent;color:var(--accent);border:2px solid var(--accent);border-radius:12px;padding:0 16px;font-weight:700;min-height:46px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ok{background:var(--fert);color:var(--fert-ink);border-radius:12px;padding:10px 12px;font-size:14px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-head h2{margin:0;text-transform:capitalize}
.arrow{background:transparent;border:2px solid var(--accent);color:var(--accent);border-radius:12px;width:46px;height:46px;font-size:20px;font-weight:700;cursor:pointer}
.dow,.cells{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow span{text-align:center;font-size:11px;color:var(--muted)}
.cell{aspect-ratio:1/1;border-radius:10px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:14px;font-variant-numeric:tabular-nums;border:1.5px solid transparent;min-height:38px}
.cell.out{visibility:hidden}
.cell.p{background:var(--period);color:var(--period-ink);font-weight:700}
.cell.pp{border:1.5px dashed var(--period);color:var(--period)}
.cell.fe{background:var(--fert);color:var(--fert-ink)}
.cell.ov{background:var(--ov);color:var(--ov-ink);font-weight:800}
.cell.today{box-shadow:0 0 0 2px var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.hist{display:flex;flex-direction:column}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.hist div:last-child{border-bottom:0}
.foot{text-align:center;color:var(--accent);font-weight:700;margin-top:6px}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
"use strict";
var DAY=86400000,KEY='dragon-cycle-simple-v1';
var MONTHS=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
function D(s){var a=s.split('-').map(Number);return Date.UTC(a[0],a[1]-1,a[2]);}
function iso(t){return new Date(t).toISOString().slice(0,10);}
function fmt(t){var x=new Date(t);return String(x.getUTCDate()).padStart(2,'0')+'.'+String(x.getUTCMonth()+1).padStart(2,'0')+'.'+x.getUTCFullYear();}
function todayT(){var n=new Date();return Date.UTC(n.getFullYear(),n.getMonth(),n.getDate());}
function plural(n,a,b,c){n=Math.abs(n)%100;var m=n%10;if(n>10&&n<20)return c;if(m>1&&m<5)return b;if(m===1)return a;return c;}
function days(n){return n+' '+plural(n,'день','дня','дней');}

var starts=[];
try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(Array.isArray(o)&&o.length)starts=o;}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(starts));}catch(e){}}

var now=new Date(),calY=now.getFullYear(),calM=now.getMonth(),msg='',justAdded=null;
var PL=5,LUT=14,DEF=28;

function calc(){
  var T=todayT();
  var s=starts.slice().sort().map(D);
  var lens=[];for(var i=1;i<s.length;i++)lens.push(Math.round((s[i]-s[i-1])/DAY));
  var r3=lens.slice(-3);
  var L=lens.length?Math.round(r3.reduce(function(a,b){return a+b;},0)/r3.length):DEF;
  var last=s[s.length-1];
  var period={},pred={},fert={},ovs={},rows=[];
  s.forEach(function(t){for(var q=0;q<PL;q++)period[t+q*DAY]=1;});
  for(var j=0;j<s.length-1;j++)rows.push({start:s[j],next:s[j+1],ov:s[j+1]-(LUT+1)*DAY});
  for(var k=0;k<60;k++){
    var st=last+k*L*DAY,nx=st+L*DAY;
    if(k>=1&&st>T+183*DAY)break;
    rows.push({start:st,next:nx,ov:nx-(LUT+1)*DAY,k:k});
    if(k>=1)for(var q2=0;q2<PL;q2++)pred[st+q2*DAY]=1;
  }
  rows.forEach(function(r){for(var t=r.ov-5*DAY;t<=r.ov+DAY;t+=DAY)fert[t]=1;ovs[r.ov]=1;});
  var cur=rows.filter(function(r){return r.k===0;})[0];
  return {T:T,s:s,lens:lens,L:L,last:last,period:period,pred:pred,fert:fert,ovs:ovs,rows:rows,cur:cur};
}

function render(){
  if(!starts.length){
    var T0=todayT();
    document.getElementById('root').innerHTML='<header><h1>Дракончики моего котёнка ♥️</h1><div class="for">Специально для моей любимой жинки</div></header>'+
      '<div class="card"><div class="k">Первый шаг</div><div class="big" style="font-size:19px;margin-bottom:12px">Когда начались последние месячные?</div>'+
      '<div class="date-row"><input type="date" id="d" value="'+iso(T0)+'" aria-label="Дата начала месячных"></div></div>'+
      '<button class="main" data-act="other">Записать</button><div class="sub">Дальше достаточно нажимать одну кнопку, когда начинаются новые месячные.</div>';
    return;
  }
  var c=calc(),T=c.T,cur=c.cur,day=Math.round((T-c.last)/DAY)+1,phase;
  if(T>=cur.next)phase=T===cur.next?'Сегодня ждём месячные':'Месячные задерживаются на '+days(Math.round((T-cur.next)/DAY));
  else if(day<=PL)phase='Месячные';
  else if(T<cur.ov-5*DAY)phase='До фертильных дней';
  else if(T<=cur.ov+DAY)phase=T===cur.ov?'Скорее всего день овуляции':'Фертильные дни';
  else phase='После овуляции';

  var h='<header><h1>Дракончики моего котёнка ♥️</h1><div class="for">Специально для моей любимой жинки</div></header>';
  h+='<div class="card now"><div class="k">Сегодня, день цикла '+day+'</div><div class="phase">'+phase+'</div></div>';
  h+='<button class="main" data-act="today">Месячные начались сегодня</button>';
  if(msg)h+='<div class="ok">'+msg+(justAdded?' <button class="link" data-act="undo">Это ошибка, отменить</button>':'')+'</div>';
  h+='<div class="date-row"><input type="date" id="d" value="'+iso(T)+'" aria-label="Дата начала месячных"><button data-act="other">Записать эту дату</button></div>';

  h+='<h2>Что будет дальше</h2><div class="grid2">';
  h+='<div class="card"><div class="k">Следующие месячные</div><div class="big">'+fmt(cur.next)+'</div></div>';
  h+='<div class="card"><div class="k">Овуляция примерно</div><div class="big">'+fmt(cur.ov)+'</div></div>';
  h+='<div class="card"><div class="k">Лучшие дни для малыша</div><div class="big" style="font-size:17px">'+fmt(cur.ov-5*DAY)+' – '+fmt(cur.ov+DAY)+'</div></div>';
  h+='<div class="card"><div class="k">Тест на беременность</div><div class="big">с '+fmt(cur.next+DAY)+'</div></div>';
  h+='</div>';
  h+='<div class="sub">'+(c.lens.length?'Считаем по твоим прошлым циклам: '+days(c.L)+'.':'Пока считаем цикл в '+days(c.L)+'. Когда запишешь следующие месячные, станет точнее.')+' Даты примерные.</div>';

  var first=Date.UTC(calY,calM,1),dim=new Date(Date.UTC(calY,calM+1,0)).getUTCDate(),off=(new Date(first).getUTCDay()+6)%7;
  h+='<div class="cal-head"><button class="arrow" data-act="prev" aria-label="Назад">‹</button><h2>'+MONTHS[calM]+' '+calY+'</h2><button class="arrow" data-act="next" aria-label="Вперёд">›</button></div>';
  h+='<div class="card"><div class="dow"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div><div class="cells" style="margin-top:4px">';
  for(var i=0;i<off;i++)h+='<div class="cell out"></div>';
  for(var d=1;d<=dim;d++){
    var t=Date.UTC(calY,calM,d),cls='cell';
    if(c.period[t])cls+=' p';else if(c.ovs[t])cls+=' ov';else if(c.fert[t])cls+=' fe';else if(c.pred[t])cls+=' pp';
    if(t===T)cls+=' today';
    h+='<div class="'+cls+'">'+d+'</div>';
  }
  h+='</div><div class="legend"><span style="--c:var(--period)">месячные</span><span style="--c:var(--fert)">фертильные дни</span><span style="--c:var(--ov)">овуляция</span></div></div>';

  h+='<h2>Мои месячные</h2><div class="card hist">';
  c.s.slice().reverse().forEach(function(t,idx,arr){
    var prev=arr[idx+1];
    h+='<div><span>'+fmt(t)+'</span><span class="k">'+(prev?'цикл '+days(Math.round((t-prev)/DAY)):'первая запись')+'</span></div>';
  });
  h+='</div><div class="foot">С любовью ♥️</div>';
  document.getElementById('root').innerHTML=h;
}

function add(dateStr){
  if(!dateStr){msg='Выбери дату.';justAdded=null;render();return;}
  if(starts.indexOf(dateStr)>=0){msg='Эта дата уже записана.';justAdded=null;render();return;}
  starts.push(dateStr);starts.sort();save();
  justAdded=dateStr;msg='Записано: '+fmt(D(dateStr))+'. Прогноз обновлён ♥️';
  var t=D(dateStr);calY=new Date(t).getUTCFullYear();calM=new Date(t).getUTCMonth();
  render();window.scrollTo(0,0);
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act');
  if(a==='today')add(iso(todayT()));
  else if(a==='other')add(document.getElementById('d').value);
  else if(a==='undo'){var i=starts.indexOf(justAdded);if(i>0||(i===0&&starts.length>1))starts.splice(i,1);save();justAdded=null;msg='Запись отменена.';render();}
  else if(a==='prev'){calM--;if(calM<0){calM=11;calY--;}render();}
  else if(a==='next'){calM++;if(calM>11){calM=0;calY++;}render();}
});
render();
})();
</script>
</body>
</html>
